plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'net.wushilin'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperties System.getProperties().findAll { key, _ ->
        key.toString().startsWith('streamload.perf')
    }
}

javadoc {
    options.addBooleanOption('html5', true)
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'net.wushilin'
            artifactId = 'doris-stream-load'
            version = project.version

            from components.java

            pom {
                name = 'Doris Stream Load Java Client'
                description = 'A Java client for Apache Doris Stream Load API with batching, retries, and async handles'
                url = 'https://github.com/wushilin/doris_java_stream_load'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'wushilin'
                        name = 'Wu Shilin'
                        email = 'wushilin.sg@gmail.com'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/wushilin/doris_java_stream_load.git'
                    developerConnection = 'scm:git:ssh://github.com/wushilin/doris_java_stream_load.git'
                    url = 'https://github.com/wushilin/doris_java_stream_load'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repos/releases')
        }
    }
}
